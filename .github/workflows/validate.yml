name: Validate template

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify PowerShell 7.6 or newer
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.6' -or -not [Environment]::Is64BitProcess) {
            throw "Expected 64-bit PowerShell 7.6 or newer; observed $($PSVersionTable.PSVersion)."
          }
          Write-Output "PowerShell $($PSVersionTable.PSVersion); 64-bit=$([Environment]::Is64BitProcess)"
      - name: Install Bicep
        env:
          AZURE_CONFIG_DIR: ${{ runner.temp }}/azure-config
        run: |
          az config set bicep.use_binary_from_path=false
          if ($LASTEXITCODE -ne 0) { throw 'Unable to configure the Bicep installation.' }
          az bicep install --version v0.46.1
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Bicep.' }
      - name: Run registered offline validation
        env:
          AZURE_CONFIG_DIR: ${{ runner.temp }}/azure-config
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          ./scripts/Test-Repository.ps1 -BicepPath (Join-Path $env:AZURE_CONFIG_DIR 'bin/bicep')
